<style>
    .top-bar-main {
        position: sticky;
        top: 0;
        z-index: 1000;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 16px;
        height: 64px;

        margin-bottom: 10px;
    }

        width: auto;
        object-fit: contain;
    }

    }

    @media (max-width: 768px) {
        .top-bar-main {
            padding: 0 12px;
        }

        .logo-img {
            max-height: 40px;
        }
    }

    /* View Transitions API 样式 */
    @view-transition {
        navigation: auto;
    }

    ::view-transition-old(root),
    ::view-transition-new(root) {
        animation-duration: 150ms;
        animation-timing-function: ease-out;
    }

    ::view-transition-old(root) {
        animation-name: view-fade-out;
    }

    ::view-transition-new(root) {
        animation-name: view-fade-in;
    }

    @keyframes view-fade-out {
        from {
            opacity: 1;
        }

        to {
            opacity: 0;
        }
    }

    @keyframes view-fade-in {
        from {
            opacity: 0;
        }

        to {
            opacity: 1;
        }
    }

    .top-bar {
        view-transition-name: top-bar;
    }

    ::view-transition-old(top-bar),
    ::view-transition-new(top-bar) {
        animation-duration: 0.2s;
        animation-timing-function: steps(2, end);
    }
</style>
<script>
    (function () {
        "use strict";
        if (!document.querySelector('meta[name="view-transition"]')) {
            const meta = document.createElement("meta");
            meta.name = "view-transition";
            meta.content = "same-origin";
            document.head.prepend(meta);
        }
    })();
</script>

<script>
(function () {
    const STORAGE_KEY = 'leave_detail_date_config';

    function getConfig() {
        try {
            return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
        } catch (e) {
            return {};
        }
    }

    function applyConfig() {
        const config = getConfig();
        if (!config.startDate && !config.endDate) return;

        const labels = Array.from(document.querySelectorAll('.info-label'));
        labels.forEach((labelEl) => {
            const label = (labelEl.textContent || '').trim();
            const valueEl = labelEl.nextElementSibling;
            if (!valueEl || !valueEl.classList.contains('info-value')) return;

            if (label === '请假开始日期' && config.startDate) {
                valueEl.textContent = config.startDate;
            }
            if (label === '请假结束日期' && config.endDate) {
                valueEl.textContent = config.endDate;
            }
        });
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', applyConfig);
    } else {
        applyConfig();
    }
})();
</script>

<script>
(function () {
  const STORAGE_KEY = 'leave_detail_date_config';
  function getConfig() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch (e) { return {}; }
  }
  function applyConfig() {
    const config = getConfig();
    const labels = Array.from(document.querySelectorAll('.info-label'));
    labels.forEach((labelEl) => {
      const label = (labelEl.textContent || '').trim();
      const valueEl = labelEl.nextElementSibling;
      if (!valueEl || !valueEl.classList.contains('info-value')) return;
      if (label === '请假开始日期' && config.startDate) valueEl.textContent = config.startDate;
      if (label === '请假结束日期' && config.endDate) valueEl.textContent = config.endDate;
    });
    const name = (config.name || '').trim() || '郑思航';
    document.title = '请假详情 - ' + name;
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', applyConfig); else applyConfig();
})();
</script>
