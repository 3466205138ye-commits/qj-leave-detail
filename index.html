<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>配置请假详情</title>
  <link rel="icon" href="img/school-logo.webp" type="image/webp">
  <link rel="stylesheet" href="components/variables.css">
  <link rel="stylesheet" href="styles/fbtn.css">
  <style>
    body { margin:0; font-family:var(--font-family,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif); background:var(--bg-secondary,#f9fafb); color:#111827; }
    .page { max-width:720px; margin:40px auto; padding:24px; }
    .card { background:#fff; border:2px solid var(--border-light,#e5e7eb); border-radius:12px; padding:24px; box-shadow:0 4px 12px rgba(0,0,0,.05); }
    h1 { margin:0 0 24px; font-size:24px; }
    .field { margin-bottom:18px; }
    .field label { display:block; margin-bottom:8px; font-weight:600; }
    .field input { width:100%; box-sizing:border-box; border:2px solid var(--border-light,#e5e7eb); border-radius:8px; padding:12px 14px; font-size:14px; background:#fff; }
    .actions { display:flex; gap:12px; flex-wrap:wrap; margin-top:24px; }
    .tips { margin-top:14px; color:#6b7280; font-size:13px; }
  </style>
  <!-- 手机 / 微信内置浏览器适配补丁：置于页面自有样式之后，便于覆盖内联规则 -->
  <link rel="stylesheet" href="styles/wechat-mobile.css">
</head>
<body>
  <div class="page">
    <div class="card">
      <h1>配置请假详情</h1>
      <div class="field">
        <label for="name">姓名</label>
        <input id="name" type="text" placeholder="请输入姓名">
      </div>
      <div class="field">
        <label for="startDate">请假开始日期</label>
        <input id="startDate" type="date">
      </div>
      <div class="field">
        <label for="endDate">请假结束日期</label>
        <input id="endDate" type="date">
      </div>
      <div class="actions">
        <button id="saveBtn" class="fbtn fbtn-primary" type="button">确认配置</button>
        <button id="resetBtn" class="fbtn fbtn-default" type="button">恢复默认</button>
        <button id="backBtn" class="fbtn fbtn-default" type="button">返回详情页</button>
      </div>
      <div class="tips">确认后，详情页标题、请假开始日期、请假结束日期会优先使用这里的配置。</div>
    </div>
  </div>
  <script>
  (function () {
    const STORAGE_KEY = 'leave_detail_date_config';
    const nameInput = document.getElementById('name');
    const startInput = document.getElementById('startDate');
    const endInput = document.getElementById('endDate');
    function load() {
      try {
        const config = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
        if (config.name) nameInput.value = config.name;
        if (config.startDate) startInput.value = config.startDate;
        if (config.endDate) endInput.value = config.endDate;
      } catch (e) {}
    }
    document.getElementById('saveBtn').addEventListener('click', function () {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          name: nameInput.value || '',
          startDate: startInput.value || '',
          endDate: endInput.value || ''
        }));
      } catch (e) {}
      window.location.href = 'detail.html';
    });
    document.getElementById('resetBtn').addEventListener('click', function () {
      try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
      nameInput.value = '';
      startInput.value = '';
      endInput.value = '';
    });
    document.getElementById('backBtn').addEventListener('click', function () {
      window.location.href = 'detail.html';
    });
    load();
  })();
  </script>
</body>
</html>
